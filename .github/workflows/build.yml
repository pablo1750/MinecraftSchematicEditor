name: Build Schematic Editor

on:
  push:
    branches:
      - desarrollo
    paths:
      - run_compiler.work

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/desarrollo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout desarrollo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Build production
        run: npm run build
        env:
          BASE_PATH: /editor/

      - name: Publish build summary
        if: always()
        run: |
          echo "## Schematic Editor — compilación" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rama: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node.js: 22" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verificaciones: npm ci, typecheck, build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resultado: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compiled site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: schematic-editor-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy /editor/
    needs: build
    if: github.ref == 'refs/heads/desarrollo' && vars.EDITOR_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: minecraft-editor
    steps:
      - name: Descargar compilación validada
        uses: actions/download-artifact@v4
        with:
          name: schematic-editor-dist
          path: dist

      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EDITOR_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EDITOR_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.EDITOR_SSH_HOST }}
          DEPLOY_USER: ${{ vars.EDITOR_SSH_USER }}
          DEPLOY_PORT: ${{ vars.EDITOR_SSH_PORT }}
          DEPLOY_PATH: ${{ vars.EDITOR_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+/editor/?$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "DEPLOY_TARGET=$DEPLOY_USER@$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$DEPLOY_PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_PATH=$DEPLOY_PATH" >> "$GITHUB_ENV"

      - name: Publicar solo archivos del editor
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_TARGET" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --no-perms --no-owner --no-group -e "ssh -p $DEPLOY_PORT" dist/ "$DEPLOY_TARGET:$DEPLOY_PATH/"
          echo "## Publicación del editor" >> "$GITHUB_STEP_SUMMARY"
          echo "- Destino público: https://minecraft.pablogonzalez.ar/editor/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ruta remota: \u0060$DEPLOY_PATH\u0060" >> "$GITHUB_STEP_SUMMARY"
          echo "- Solo archivos de dist/; no se borra contenido preexistente" >> "$GITHUB_STEP_SUMMARY"
